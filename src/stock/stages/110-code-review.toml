# Skipped on docs: there is no code to review in a change with none.

id                 = "code-review"
role               = "reviewer"
when               = "not-docs"
requires           = ["code", "ci_green"]
produces_for_human = ["review_report"]

[review]
sends_back_to = "build"
invalidates   = ["ci_green", "tests_green"]

[verify.review_report]
# A report a person reads: what it says is judgement, and only that it exists is
# checkable. The path is what makes even that much come from git rather than from
# the agent's own word.
kind = "existence"
handover = "store"
