# Unlike the others, this condition is not about the nature of the task: whether
# the change touched the structure is only knowable after looking at what build
# produced.

id                 = "architecture"
role               = "architect"
when               = "touched-structure"
requires           = ["code"]
produces_for_human = ["arch_report"]

[review]
sends_back_to = "build"
invalidates   = ["ci_green", "tests_green"]

[verify.arch_report]
# A report a person reads: what it says is judgement, and only that it exists is
# checkable. The path is what makes even that much come from git rather than from
# the agent's own word (ADR-0070).
kind = "existence"
path = "reports/"
