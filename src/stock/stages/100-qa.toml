# Skipped on a chore: a one-line change does not earn a QA pass (ADR-0014).

id                 = "qa"
role               = "qa"
when               = "not-chore"
requires           = ["ci_green", "briefing"]
produces_for_human = ["qa_report"]

[review]
sends_back_to = "build"
# The green attested to code that no longer exists (ADR-0020).
invalidates   = ["ci_green", "tests_green"]
