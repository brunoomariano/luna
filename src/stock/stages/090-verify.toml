# The pipeline is a command and the checklist is a judgement, so this stage has
# both — and a role, because the artifact that needs one decides (ADR-0040).

id                 = "verify"
role               = "verifier"
requires           = ["code", "scenarios"]
produces           = ["ci_green"]
produces_for_human = ["dod_checked"]

[verify.ci_green]
# The one artifact in the flow that earns full: `make ci` is the whole gate, and
# INV-core-4 wants it run rather than claimed.
run   = "make ci"
scope = "full"

[verify.dod_checked]
# A checklist a person reads. Recording it as a passing check would be the lie
# ADR-0032 names — so the check is that it was written, not that it is right.
#
# This is the artifact RFC-0004 was written about: an agent produced 144 lines of
# exactly this content, committed them to a file called `verification`, and the
# stage closed green without `dod_checked` ever appearing. ADR-0070 answered that
# with git; RFC-0008 answers it with Luna's own store, which is a stronger witness
# and keeps a checklist out of the repository's delivered history.
kind     = "existence"
handover = "store"
