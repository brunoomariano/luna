id       = "commit"
requires = ["ci_green", "code"]
produces = ["commit_sha"]

[verify.commit_sha]
# INV-core-4 names this one literally: the commit resolves to exactly one object
# and that object is a commit. `^{commit}` makes git fail rather than answer for
# a tag or a tree, and --verify makes an ambiguous name an error instead of a
# guess.
run   = "git rev-parse --verify HEAD^{commit}"
scope = "full"

[gate]
kind   = "confirm-write"
reason = "confirm the write"
