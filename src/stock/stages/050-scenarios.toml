id       = "scenarios"
role     = "gherkin"
requires = ["briefing", "kind"]
produces = ["scenarios", "approach"]

[verify.scenarios]
kind = "existence"

[verify.approach]
kind = "existence"

[gate]
kind   = "confirm"
reason = "approve the plan"
# What this gate is for, in the form the lead is asked and a person reads
# (ADR-0063). A gate declaring nothing does not wait, so this is also what makes
# the shipped flow stop here at all.
criticality = 8
judge = [
  "The scenarios describe observable behaviour, not implementation steps",
  "The approach names what will change, and nothing outside the task",
]
