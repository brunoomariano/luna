# A contract is worth writing when there is new behaviour or a defect; a chore or
# a docs change carries its own definition.

id       = "spec"
role     = "specifier"
when     = "is-feature-or-bug"
requires = ["approach"]
produces = ["contract"]

[verify.contract]
kind = "existence"
handover = "store"

[gate]
kind     = "review-artifact"
artifact = "contract"
reason   = "review the contract"
# Higher than the plan's: a contract is what every later stage is held to, and a
# wrong one is discovered at `verify` rather than here.
criticality = 9
judge = [
  "The contract states what is required and what is forbidden, with no suggestions",
  "Every acceptance criterion in the task appears as an obligation",
  "No artifact is named that the contract does not define",
]
