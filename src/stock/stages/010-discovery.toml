# The flow Luna ships with — the 14 stages of docs/architecture/stages.md.
#
# One file per stage, ordered by the numeric prefix in the filename. Order is
# significant: AuditContract checks precedence, not existence.
#
# Nothing here is mandatory. A stage can be disabled, edited or replaced, and new
# ones created (ADR-0017) — `luna init` puts a copy of these in .luna/stock/ for
# a project to edit. What does not change is the contract: every stage declares
# what it requires and what it produces.

id       = "discovery"
role     = "scout"
requires = ["task_id"]
produces = ["repos"]

[verify.repos]
# Which repositories a task touches is a judgement. Nothing runs to prove it.
kind = "existence"

[gate]
kind   = "confirm"
reason = "confirm the repositories"
