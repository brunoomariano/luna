# Reading the task, the code and what the project already knows — and concluding
# which of the two kinds of work this is.
#
# The triage is the reason this stage got bigger. It used to produce `kind`, and
# that was removed on the argument that the task already carried it from
# `luna task new --kind`. The argument holds for a *declaration* and not for a
# *finding*: what a person types when opening a task is said before anyone has
# read the code, and whether something is broken or merely missing is exactly what
# reading it settles. So the kind stays where it is, and this stage records a fact
# beside it.
#
# The two are not interchangeable and are deliberately not merged: one is intent,
# the other is a conclusion, and a later reader needs to know which they are
# looking at.

id       = "intake"
agent    = "claude"
requires  = ["task_id", "worktree"]
produces  = ["briefing"]
# What this stage may conclude, and nothing else. A stage that could record any
# fact could switch on a conditional stage from anywhere in the flow.
discovers = ["triaged_bug"]
brief    = "You are opening the task, and you owe one document: a briefing the later stages work from. Do three things before you write it. First, read what the task states and the code it names, and find where the change belongs — the files, the seam, the callers. Second, read what the project already knows: its durable memory, its decisions, its lessons. You are looking for the gotcha somebody already paid for, the decision that already settled this question, and the thing the task asks for that has already been done. Say when you find one; a briefing that repeats a solved problem costs the whole trail. Third, name contradictions — between the task and the code, between the task and a recorded decision, or inside the task itself. An unresolved contradiction is worth more in the briefing than a clean-looking summary that buried it. Then classify: is something BROKEN, or is something MISSING? Broken means there is behaviour that exists and is wrong, and a cause to find; missing means the behaviour is not there yet. Say which, in those words, and say what settled it — if it is broken, the investigation stage runs next and the whole shape of the work changes, so this is not a label, it is a decision with a bill. If you genuinely cannot tell from the code, say that instead of guessing: the honest answer sends it down the shorter path, and a wrong 'broken' pays for an investigation with nothing to investigate. Record the conclusion in the briefing as a line of its own, exactly `FACT: triaged_bug`, and only when something is broken — Luna reads that line and nothing else, so a paragraph explaining that it is a bug decides nothing. Write nothing on that line when something is merely missing; there is no fact for the ordinary case. You do not plan the change here and you do not write code."

[verify.briefing]
# Handed to Luna rather than written into the tree, and this is the fix for a leak
# rather than a tidy-up. Measured twice: one run committed the briefing under
# `.luna/`, another at the root, and neither agent was being careless — a file
# only survives into the next stage's worktree if it is committed, so the contract
# left them no choice.
kind     = "existence"
handover = "store"
