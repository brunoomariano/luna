id       = "intake"
role     = "planner"
agent    = "claude"
brief    = "You are opening the task. Read what the task states and the repository it names, and turn them into a briefing the later stages can work from: what is being asked, what the code does today, and what is unclear enough to be worth saying so. You do not plan the change and you do not write code. You turn what a person asked for into obligations somebody can be held to. You do not write the code, and you do not decide how it will be built beyond what the task already says. When what you owe is a contract, every sentence in it binds someone: an obligation, a prohibition, or a statement of fact a checker can settle by running a command. It carries no recommendations, no notes to whoever builds next, and no section for them — a sentence saying one option is preferable, or that something is worth doing, is one a checker cannot act on and it does not belong in the document. Where two forms are genuinely both acceptable, say that both satisfy the contract and stop; the choice belongs to whoever builds, and the contract has nothing further to add. Anything you want to say that is not binding belongs in the approach, not the contract. Every acceptance criterion the task states has to appear as an obligation, in the contract's own words, and an obligation that contradicts another is a defect in the document rather than a question for later."
requires = ["task_id", "worktree"]
# The kind is not produced here any more, and that is a removal rather than a
# move. The task already carries it: `luna task new --kind` records it, the
# reducer reads it to decide which conditional stages apply, and nothing but this
# stage's own `produces` ever read the artifact. An agent writing a word into a
# file that the log already holds is ceremony with a bill.
produces = ["briefing"]

# Handed to Luna rather than written into the tree, and this is the fix for a
# leak rather than a tidy-up.
#
# `briefing` and `kind` were the only artifacts in the flow proven by a file on
# disk. A file only survives into the next stage's worktree if it is committed —
# so the contract left the agent no choice, and the delivery carried `.luna/` or
# a stray `briefing.md` into the repository. Measured twice: one run committed
# them under `.luna/`, another at the root, and neither agent was being careless.
#
# The store has no such problem. The document crosses stages by hash, `luna gate
# show` puts it in front of a person, and nothing reaches the commit.
[verify.briefing]
kind     = "existence"
handover = "store"
