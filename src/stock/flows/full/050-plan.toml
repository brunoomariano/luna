# Scenarios, approach and contract in one stage, because they were one piece of
# work billed as two. Measured on the first full run under the headless transport:
# `scenarios` cost $2.02 and `spec` $2.12, together 61% of a $6.78 task.
#
# Spec-anchored, and the three words matter. The plan is not spec-first — nothing
# here becomes an RFC, a PRD or an ADR, and no document is written into the
# repository. It is not spec-source either — the code is not generated from it.
# It is the anchor the delivery is held against, it lives in the store for the
# length of the task, and it is thrown away after.

id       = "plan"
agent    = "claude"
# Fresh, not live, and the static check is what said so: on a bug task `diagnose`
# runs immediately before this, so continuing "the previous session" would mean
# continuing the investigator's. AuditContextChain refuses a live stage briefed
# differently from its predecessor, and it refused this one.
context  = "fresh"
requires = ["briefing"]
produces = ["scenarios", "approach", "contract"]
brief    = "You are planning the change, and the plan is read by a person who will approve or adjust it. You owe three things. The scenarios: what the delivery has to do, one behaviour per entry, each written as an observable result rather than an intention — `./tally.sh --avg 1 2 3 prints 2`, not `averaging works`. Every acceptance criterion in the task appears as a scenario; a criterion you leave out is one nothing will check. On a bug, the first scenario is the minimised case from the investigation, so the fix is pinned by a regression before anything else is added. The approach: how you intend to build it, and the alternatives you considered and rejected, with the reason. Say plainly where the approach is genuinely open rather than inventing a constraint — a design line that invents one becomes an obligation somebody has to satisfy. The contract: what is required and what is forbidden, as obligations a checker can settle. Every sentence in it binds someone. It carries no recommendations, no notes for later and no section for them: a sentence saying one option is preferable is one a checker cannot act on, and it does not belong in the document. Where two forms genuinely both satisfy it, say that both do and stop. Finally, the open questions: anything the task leaves ambiguous enough that two readings produce different deliveries. State each as a question with the options, not as an assumption you already made — this is the one place where a person can still answer cheaply. Keep the whole thing structured and free of ceremony; it is a working document, not a deliverable."

[verify.scenarios]
kind     = "existence"
handover = "store"

[verify.approach]
kind     = "existence"
handover = "store"

[verify.contract]
kind     = "existence"
handover = "store"

[gate]
kind     = "review-artifact"
artifact = "contract"
reason   = "review the plan and its contract"
# The plan fixes the whole boundary of the delivery at once, and everything after
# it runs against that boundary. A wrong contract surfaces at the far end of the
# loop, after the rounds have been paid for.
autonomy_floor = 9
# Every criterion is about the contract, because the contract is what the gate
# attaches — a gate carries one artifact. A real judgement found this: asked about
# the scenarios, the lead correctly answered UNSUPPORTED, because it had been given
# a document that only *references* them. Asking about what is not shown is how a
# gate teaches whoever answers it to guess.
judge = [
  "The contract states what is required and what is forbidden, with no suggestions",
  "Every acceptance criterion in the task appears as an obligation",
  "No obligation contradicts another, and none contradicts the task",
]

# All of them, because this gate asks about prose that has not become code yet:
# there is nothing to run a check against, and without this the lead marks every
# criterion unsupported and the gate goes to a person at any autonomy. Measured on
# TALLY-3, which stopped here under `nightly`.
judge_by_reading = [
  "The contract states what is required and what is forbidden, with no suggestions",
  "Every acceptance criterion in the task appears as an obligation",
  "No obligation contradicts another, and none contradicts the task",
]
