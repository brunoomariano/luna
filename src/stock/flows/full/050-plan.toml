# Scenarios, approach and contract in one stage, because they were one piece of
# work billed as two. Measured on the first full run under the headless
# transport: `scenarios` cost $2.02 and `spec` $2.12, together 61% of a $6.78
# task whose entire content was a `--loud` flag — and `contract`, the artifact
# the second stage existed to produce, is required by no stage in the flow.
#
# It is not waste, though: the obligations the contract created are where that
# run's unrequested quality came from (a shellcheck pass, idempotent repeated
# flags, exit 2 with a diagnostic). So the contract stays an artifact and the
# gate that reviews it stays; what goes is the second cold start, the second
# session and the lower of the two gates.

id       = "plan"
role     = "planner"
# Fresh, not live, and the static check is what said so: on a bug task
# `diagnose` runs immediately before this, so continuing "the previous session"
# would mean continuing the investigator's. AuditContextChain refuses a live
# stage whose predecessor holds a different role, and it refused this one.
context  = "fresh"
requires = ["briefing"]
produces = ["scenarios", "approach", "contract"]

[verify.scenarios]
kind     = "existence"
handover = "store"

[verify.approach]
kind     = "existence"
handover = "store"

[verify.contract]
kind     = "existence"
handover = "store"

[gate]
kind     = "review-artifact"
artifact = "contract"
reason   = "review the plan and its contract"
# The higher of the two gates this stage replaces. The plan's `confirm` at 8 was
# approving something the contract gate re-approved forty turns later; a contract
# is what every later stage is held to, and a wrong one surfaces at `verify`.
criticality = 9
# Every criterion is about the contract, because the contract is what the gate
# attaches — a gate carries one artifact, and criteria about the other two
# arrived when `scenarios` and `spec` merged into this stage. A real judgement
# found it: asked about the scenarios, the lead correctly answered UNSUPPORTED,
# because it had been given a document that only *references* them. Asking about
# what is not shown is how a gate teaches whoever answers it to guess.
#
# The scenarios and the approach are still handed over and still readable with
# `luna artifact get`. What is not claimed is that this gate reviewed them.
# The third criterion asks only what the contract settles about itself. It read
# "none is impossible to satisfy", and that is a question about code: whether an
# obligation can be met depends on the script being modified, which this gate
# does not show. The lead answered it honestly — "depends on what today's
# tally.sh actually contains, which I cannot read" — and had to mark it
# unsupported, which sends the gate to a person at any autonomy.
#
# It is the same lesson as the paragraph above, in a different criterion: asking
# about what is not shown teaches whoever answers to guess. Whether the delivery
# actually satisfies the contract is `verify`'s question now — that stage
# requires the contract and has the code.
judge = [
  "The contract states what is required and what is forbidden, with no suggestions",
  "Every acceptance criterion in the task appears as an obligation",
  "No obligation contradicts another, and none contradicts the task",
]

# All of them, because this gate asks about prose that has not become code yet:
# there is nothing to run a check against, and without this the lead marks every
# criterion unsupported and the gate goes to a person at any autonomy. Measured
# on TALLY-3, which stopped here under `nightly`.
#
# It does not mean the artifact is believed. The brief still refuses its verdict
# about itself and asks for the line that settles each criterion.
judge_by_reading = [
  "The contract states what is required and what is forbidden, with no suggestions",
  "Every acceptance criterion in the task appears as an obligation",
  "No obligation contradicts another, and none contradicts the task",
]
