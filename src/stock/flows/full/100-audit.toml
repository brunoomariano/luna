# `review` until the roles collapsed, and the rename is the honest part of that.
#
# A review is independent or it is not a review. With one agent the thing that
# made it independent is gone: `tools_deny` cannot separate writing from judging
# when the same agent must do both, and there is no second role whose session it
# could be kept out of. Calling it `review` afterwards would claim a property the
# design no longer has — the same shape of lie the evidence scopes exist to refuse,
# arriving through a stage name.
#
# What it still is: the same agent re-reading its own work with no memory of
# writing it. `context = "fresh"` is not decoration here — it is the one half of
# independence that survives a single agent, and without it the stage reads its own
# reasoning back and confirms it.
#
# It stays in the flow rather than being deleted, and the reason is measured: on
# the one full cycle that reached it, this stage found a genuine violation of the
# contract's own clause — a pattern match where a byte comparison was required —
# named the file, the line and a reproducing command, and sent the work back. That
# was the first time the send-back mechanism ever fired. Whether it still finds
# that when auditing itself is unmeasured, and the honest move is to keep the stage
# and go and measure it.
#
# The four lenses live in the role's brief rather than here: a stage file has no
# section for them and the parser refuses a key it does not know.

id                 = "audit"
agent    = "claude"
tools_deny = ["Edit", "Write"]
brief    = "You are re-reading a delivery you have no memory of writing, and judging it. You judge what was delivered, and you cannot edit it — that is the point of you. Do not trust the delivery's own account of itself: the contract obliges things, and an obligation you cannot find satisfied is a finding whatever the suite says. Apply each lens the work admits and say what each found, including when it found nothing. correctness: does the code do what the scenarios and the contract say, including where those two disagree? coverage: what does the suite not cover — the case that would still pass if the behaviour were absent? robustness: what breaks under load, attack or absence — empty input, a failing dependency, a concurrent caller? structure: did the change move the system's shape, and does the shape still hold? A finding names the file and the line, what goes wrong, and the input that makes it go wrong; a finding you cannot state that way is an impression and belongs in the report as one. Every finding opens with exactly one tag on its own line, in square brackets, and Luna reads only the tag: [BLOCKING] this change introduced the defect, or it breaks a stated acceptance criterion — this and only this sends the work back; [SHOULD-FIX] a real defect this change did not introduce, or that no acceptance criterion covers; [NIT] a preference; [UNCERTAIN] you suspect a defect and cannot confirm it, and you say what would confirm it. An untagged finding is invisible to Luna, so a defect you describe without a tag is one you did not report. Do not reach for [BLOCKING] because a defect is serious: a serious defect that was already there is [SHOULD-FIX], and blocking on it reopens the work to fix something nobody asked about. Ask what this change did, not what the file deserves."
context            = "fresh"
when               = "not-chore"
requires           = ["code", "ci_green"]
produces_for_human = ["audit_report"]

[review]
sends_back_to = "build"
# The green attested to code that no longer exists.
invalidates   = ["ci_green", "tests_green"]

[verify.audit_report]
# A report a person reads: what it says is judgement, and only that it exists is
# checkable. The handover is what makes even that much come from Luna rather than
# from the agent's own word.
kind     = "existence"
handover = "store"
