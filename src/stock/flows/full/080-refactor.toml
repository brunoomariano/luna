id       = "refactor"
role     = "cleaner"
agent    = "claude"
brief    = "You are cleaning up code that is already green, and the green is yours to re-earn: the tests attested to code you are about to change. Behaviour does not move — if a test has to change to pass, you have changed behaviour and that is the thing you must not do. You clean up without changing behaviour. Everything the code did before your change it still does after, and the suite is how you show it — you re-run it and you re-earn the green, because a refactor that inherits somebody else's passing run has proved nothing. You do not add features, you do not widen scope, and you do not fix a defect you find: a defect is a finding, and it belongs in the report with the file, the line and the input that triggers it. What you may do is take out duplication, name what is unnamed, cut a function that grew past reading, and move a boundary that is in the wrong place."
# Fresh, and the pack is what made it so. A cleaner continuing the coder's
# session reads its reasoning instead of its output, and the whole reason this
# stage is a separate role is that it has to re-earn the green over code it did
# not write. AuditContextChain refuses a live stage whose predecessor holds a
# different role, and it refused this one the moment `build` became `coder`.
context  = "fresh"
requires = ["code", "tests_green"]
produces = ["code", "tests_green"]

[verify.tests_green]
# The stage rewrites code that was already green, so the green has to be earned
# again rather than inherited: `tests_green` from `build` attested to code this
# stage just changed, which is the invalidation a review finding causes.
#
# It produced only `code` until this was noticed, and `code` closes on existence
# — so a stage whose entire purpose is rewriting working code closed without
# running anything.
run   = "make test"
scope = "targeted"

[verify.code]
# The same reasoning as `build`: no command proves `code` itself — the compiler
# is part of `make test`, and "the diff is non-empty" proves nothing. It closes
# on existence, and that is said rather than defaulted.
kind = "existence"
