# `contract` is in requires now, which it could not be while it came from a
# conditional stage: `spec` was skipped on a chore or a docs task, so requiring
# its output would have stalled both. Merging it into the unconditional `plan`
# closed that gap — the contract is always produced, so it can always be
# required, and the conditional-requires mechanism is no longer owed anything.

id       = "build"
role     = "maker"
context  = "live"
requires = ["scenarios", "approach", "contract", "worktree"]
produces = ["code", "tests_green"]

[verify.tests_green]
# Targeted rather than full: build runs the tests it touched, and claiming the
# whole suite here would be the laundering the scopes reject. `verify` is the
# stage that earns full.
run   = "make test"
scope = "targeted"

[verify.code]
# `code` has no command that proves it — the compiler is part of `make test`, and
# "the diff is non-empty" proves nothing about it. It closes on existence, and
# that is said rather than defaulted.
kind = "existence"

[guard]
# A delivery touching any of these stops for a person, at every knob setting.
#
# Not because these changes are likelier to be wrong than any other — because
# they are the ones a person cannot undo by reading the next morning's report. A
# wrong function is a commit to revert; a dropped table, a leaked key and a
# rewritten deploy pipeline are not.
#
# The gate this opens carries no judgement criteria on purpose. Whether dropping
# a table was intended is not something Luna can weigh, so nothing here is
# waveable by a high autonomy setting — a guard a knob could get past would be
# protection in name only.
#
# Substrings, matched against the paths the delivery changed rather than against
# the tree: a repository that has always held `migrations/` would otherwise stop
# every task forever.
paths  = ["migrations/", "migrate", "secret", "credential", ".env", "deploy", ".github/workflows/", "Dockerfile"]
reason = "the delivery touches migrations, credentials or deployment"
