# Runs on what the intake concluded, not on what the task was opened as.
#
# `triaged-as-bug` reads a fact the intake recorded after reading the code;
# `is-bug` reads the kind a person typed before anyone had. The lean `fix` flow
# still uses the second, and correctly: it is chosen by somebody who already knows
# what broke and has no intake to conclude anything.
#
# There is no root cause to find when nothing broke, and the cost of asking anyway
# is measured: $0.88 over 19 turns on the task class it exists for, $2.88 over 48
# on the wrong one.

id                 = "diagnose"
agent              = "claude"
when               = "triaged-as-bug"
requires           = ["briefing"]
produces           = ["root_cause"]
produces_for_human = ["min_case"]
brief              = "You are finding why something broke, and you owe two things: the cause, and the smallest case that still reproduces it. Work in that order and do not skip to the second. Reproduce it first — a cause you cannot reproduce is a hypothesis, and saying so plainly is a better delivery than a confident guess. Then minimise: cut the case down until removing one more thing makes the failure disappear, because what is left is the cause's actual surface and everything you cut was noise somebody else would have chased. Then locate it, with evidence: name the file and the line, say what value you observed there and what you expected, and say what would prove you wrong. A cause stated without a file, a line and an observed value is an impression. You do not fix it — a later stage does that, from what you found, and a fix written here is one nobody checked against a plan. If the minimised case turns out to reproduce on the unchanged code from before this task, say so: you have found a pre-existing defect rather than the one you were sent for, and that distinction changes what happens next."

[verify.root_cause]
kind = "existence"

[verify.min_case]
# The smallest reproduction, which is a working document rather than something the
# repository keeps: it exists so whoever fixes the bug can run it, and it is
# meaningless once the fix lands.
kind     = "existence"
handover = "store"
