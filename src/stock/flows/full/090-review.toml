# The independent read, and the reason the loop was allowed to judge itself.
#
# `forge` builds, cleans, checks and decides when to stop — one agent, one
# session, its own work. That is fast and it is biased, and the bias is not
# fixable from inside: an agent asked whether its own delivery is done has already
# formed the opinion. So the correction is placed after the delivery instead of
# inside it, run by an agent that did not write any of it and cannot edit any of
# it.
#
# `context = "fresh"` is not decoration here — it is the half of independence a
# separate stage can actually have. `tools_deny` is the other half, and it works
# because this is a different agent rather than the same one asked to behave.
#
# What it decides is not whether to ship — that already happened. It is what the
# delivery is worth: approved, or sent back to the loop, or the finding belongs to
# a task nobody has opened yet.

id                 = "review"
agent              = "claude"
context            = "fresh"
tools_deny         = ["Edit", "Write"]
requires           = ["code", "shipped"]
produces_for_human = ["review_report"]
brief              = "You are reading a delivery you did not write and cannot change, and saying what it is worth. Read the task, the contract and the diff, in that order, and hold the delivery against what was promised rather than against what you would have done. Do not trust the delivery's own account of itself: an obligation you cannot find satisfied is a finding whatever the summary says. Apply each lens the work admits and say what each found, including when it found nothing. correctness: does the code do what the scenarios and the contract say, including where those two disagree? anti-regression: does anything that worked before this change still work, and would the suite notice if it stopped? coverage: what does the suite not cover — the case that would still pass if the behaviour were absent, and does any test fail if the bug comes back? silent failures: where does this swallow an error, fall back quietly, or return a default that hides a fault? design: SRP, KISS, DRY — is there duplication that is real (the same logic in three or more places, not two things that look alike), an abstraction invented before it was needed, or a name so generic that a grep returns it everywhere? security: what crosses a trust boundary here, and what is assumed about it? A finding names the file and the line, what goes wrong, and the input that makes it go wrong; a finding you cannot state that way is an impression and belongs in the report as one. Every finding opens with exactly one tag on its own line, in square brackets, and Luna reads only the tag: [BLOCKING] this change introduced the defect, or it breaks a stated acceptance criterion — this and only this sends the work back; [SHOULD-FIX] a real defect this change did not introduce, or that no acceptance criterion covers; [NIT] a preference; [UNCERTAIN] you suspect a defect and cannot confirm it, and you say what would confirm it. An untagged finding is invisible to Luna, so a defect you describe without a tag is one you did not report. Do not reach for [BLOCKING] because a defect is serious: a serious defect that was already there is [SHOULD-FIX], and blocking on it reopens work to fix something nobody asked about. Ask what this change did, not what the file deserves."

[review]
# Back into the loop, not into a fresh build: the finding is about code the loop
# produced, and the loop is where the fix belongs.
sends_back_to = "forge"
# The green attested to code that is about to change.
invalidates   = ["ci_green"]

[verify.review_report]
# A report a person reads: what it says is judgement, and only that it exists is
# checkable. The handover is what makes even that much come from Luna rather than
# from the agent's own word.
kind     = "existence"
handover = "store"
