# The judgement half. What is left here is the question no command answers:
# does the delivery honour the contract that was written for it?
#
# It requires `ci_green` now, which is what makes the split enforce anything
# rather than merely reorder two files — the entry check refuses this stage until
# the pipeline has passed, so there is no path on which a model is paid to read
# code the compiler has not accepted.
#
# The contract as well as the scenarios, because this stage is the one asked
# whether the delivery honours it. It was absent, and the gap it left was
# measured on TALLY-7: the contract required a test pinning one of its own
# decisions, the test was never written, build closed green — correctly, since
# the *stage* contract asks for `code` and `tests_green` and both arrived — and
# verify then stated that all three decisions were pinned by a test. They were
# not. Nothing in the flow compared the document against what was built.

id                 = "verify"
role               = "auditor"
requires           = ["code", "scenarios", "contract", "ci_green"]
produces_for_human = ["dod_checked"]

[verify.dod_checked]
# A checklist a person reads. Recording it as a passing check would be the lie
# the scopes name — so the check is that it was written, not that it is right.
#
# This is the artifact the whole handover was written about: an agent produced 144 lines of
# exactly this content, committed them to a file called `verification`, and the
# stage closed green without `dod_checked` ever appearing. A declared path answered
# that with git; the store answers it better, being a stronger witness
# and keeps a checklist out of the repository's delivered history.
kind     = "existence"
handover = "store"
