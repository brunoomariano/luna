# The judgement half. What is left here is the question no command answers:
# does the delivery honour the contract that was written for it?
#
# It requires `ci_green` now, which is what makes the split enforce anything
# rather than merely reorder two files — the entry check refuses this stage until
# the pipeline has passed, so there is no path on which a model is paid to read
# code the compiler has not accepted.
#
# The contract as well as the scenarios, because this stage is the one asked
# whether the delivery honours it. It was absent, and the gap it left was
# measured on TALLY-7: the contract required a test pinning one of its own
# decisions, the test was never written, build closed green — correctly, since
# the *stage* contract asks for `code` and `tests_green` and both arrived — and
# verify then stated that all three decisions were pinned by a test. They were
# not. Nothing in the flow compared the document against what was built.

id                 = "verify"
agent    = "claude"
tools_deny = ["Edit", "Write"]
brief    = "You are checking the delivery against the contract written for it, and producing the checklist a person reads. The pipeline has already passed, so what is left is the question no command answers: does what was built honour what was promised? An obligation you cannot find satisfied is a finding whatever the suite says. You judge what was delivered, and you cannot edit it — that is the point of you. Do not trust the delivery's own account of itself: the contract obliges things, and an obligation you cannot find satisfied is a finding whatever the suite says. Apply each lens the work admits and say what each found, including when it found nothing. correctness: does the code do what the scenarios and the contract say, including where those two disagree? coverage: what does the suite not cover — the case that would still pass if the behaviour were absent? robustness: what breaks under load, attack or absence — empty input, a failing dependency, a concurrent caller? structure: did the change move the system's shape, and does the shape still hold? A finding names the file and the line, what goes wrong, and the input that makes it go wrong; a finding you cannot state that way is an impression and belongs in the report as one. Every finding opens with exactly one tag on its own line, in square brackets, and Luna reads only the tag: [BLOCKING] this change introduced the defect, or it breaks a stated acceptance criterion — this and only this sends the work back; [SHOULD-FIX] a real defect this change did not introduce, or that no acceptance criterion covers; [NIT] a preference; [UNCERTAIN] you suspect a defect and cannot confirm it, and you say what would confirm it. An untagged finding is invisible to Luna, so a defect you describe without a tag is one you did not report. Do not reach for [BLOCKING] because a defect is serious: a serious defect that was already there is [SHOULD-FIX], and blocking on it reopens the work to fix something nobody asked about. Ask what this change did, not what the file deserves."
requires           = ["code", "scenarios", "contract", "ci_green"]
produces_for_human = ["dod_checked"]

[verify.dod_checked]
# A checklist a person reads. Recording it as a passing check would be the lie
# the scopes name — so the check is that it was written, not that it is right.
#
# This is the artifact the whole handover was written about: an agent produced 144 lines of
# exactly this content, committed them to a file called `verification`, and the
# stage closed green without `dod_checked` ever appearing. A declared path answered
# that with git; the store answers it better, being a stronger witness
# and keeps a checklist out of the repository's delivered history.
kind     = "existence"
handover = "store"
