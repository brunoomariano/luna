# The convergent loop: build, then hygiene, then acceptance — and then the round
# is judged and either leaves or goes again.
#
# It is one stage where there were five (`build`, `refactor`, `pipeline`,
# `verify`, `audit`), and the merge is deliberate. What it buys is that a fix
# found by acceptance goes straight back into building, inside one session, with
# the reasoning still in context — instead of a send-back that pays a cold start
# to re-read code the same agent wrote an hour ago.
#
# What it costs is stated rather than hidden: four contract boundaries. The one
# that mattered was `verify requires ci_green`, which kept a model from being paid
# to read code the compiler had not accepted — measured at $1.62, every cent spent
# before the pipeline had said anything. Inside one stage that ordering is the
# agent's to keep rather than the engine's to enforce, and the brief says so in as
# many words.
#
# What it also costs is independence: this agent judges its own work. That is why
# `review` exists after the delivery, run cold by another agent that cannot edit.
#
# The round's verdict is the model's, and the evidence is the engine's. The model
# reads the round and says what it produced — no exit code distinguishes "this
# progressed" from "this traded one failure for another". What it may not do is
# leave the loop over a command that disagrees: `converges_on` names what has to
# be green, and the reducer refuses `converged` without it.

id       = "forge"
agent    = "claude"
# Fresh, because `forge` never follows its own brief: on a feature the stage
# before it is `plan`, on a bug it is `diagnose`, and both are briefed
# differently. A builder continuing the planner's session reads the plan's
# reasoning instead of the plan.
context  = "fresh"
requires = ["scenarios", "approach", "contract", "worktree"]
produces = ["code", "ci_green", "commit_plan", "delivery_summary"]
brief    = "You are building, cleaning and checking a delivery, in a loop, and you decide when the loop ends. Run the three in order and do not reorder them. BUILD: write the tests for the scenarios first and watch them fail for the right reason — a test that passes before the code exists is testing nothing. Then write the smallest code that makes them pass. Satisfy every obligation the contract states, including the tests it says exist, and nothing beyond it: a stage that delivers more than its contract asks has done work nobody can check. HYGIENE: with the suite green, clean what you just wrote, in reversible steps, running the suite after each one. Behaviour does not move — if a test has to change to pass, you have changed behaviour, and that is the one thing this phase must not do. Look for: functions past about twenty lines, files past five hundred, duplicated logic in three or more places, dead code and unused parameters, generic names a grep returns everywhere, and `any` where a concrete type will do. Do not refactor beyond the diff you just made. ACCEPTANCE: run the repository's own gate — the Makefile target it declares, not one you invent — and confront every scenario and every acceptance criterion one by one. Say for each whether it passes, and how you know. Do not run the pipeline last as a formality: run it before you spend a turn reading, because reading code the compiler has rejected is time bought with nothing. THEN JUDGE THE ROUND, and this is the part only you can do. Compare this round against the last: how many criteria pass now against before, is the suite green, did a regression appear outside the scope, how much serious hygiene is left, and — the question that matters — did this round attack the cause or trade one problem for another? Trading A for B at the same score is not progress, it is oscillation, and calling it progress is how a loop burns four rounds going nowhere. Answer with exactly one word. CONVERGED: every acceptance criterion passes under the repository's own gate, and no serious hygiene is left. You may not say this while a check is red — the engine will refuse it, and it is right to. PROGRESSED: more passes than before, or less serious hygiene, and nothing new broken. Name the target of the next round. REGRESSED: something that passed stopped passing, or the round traded one problem for another. Undo this round rather than building on it, and try a different path to the same target. STUCK: you can see the loop will not converge — a criterion that contradicts another, an acceptance line that contradicts what the code should do, or a cause that lives outside this task. Say which, and stop; spending the remaining rounds to discover it again is the waste the ceiling exists to prevent. Never dress a round up to close the loop. When you converge, write two more things: the commit plan — the commits this delivery should become, in order, grouped by context, each with the message it should carry — and a summary of the delivery in the language of the business, for somebody who will not read the diff."

[loop]
# The mechanical floor the model's verdict moves within. `ci_green` is the
# repository's own gate over the delivered commit, and convergence is refused
# without it — which is what keeps "the loop closed" from being an opinion.
converges_on = ["ci_green"]
# The green attested to code a reverted round no longer contains.
invalidates  = ["ci_green"]
# The same ceilings the loop was specified with, and the same defaults the engine
# already carried: four rounds, two without progress, two oscillating.
max_rounds   = 4
no_progress  = 2
oscillation  = 2

[verify.ci_green]
# The one artifact in the flow that earns full scope: `make ci` is the whole gate,
# and the contract wants it run rather than claimed. A round that fails it does not
# fail the stage — it is a round, which is what a loop is for.
run   = "make ci"
scope = "full"

[verify.code]
# No command proves `code` itself — the compiler is part of `make ci`, and "the
# diff is non-empty" proves nothing about it. It closes on existence, and that is
# said rather than defaulted.
kind = "existence"

[verify.commit_plan]
kind     = "existence"
handover = "store"

[verify.delivery_summary]
kind     = "existence"
handover = "store"

[gate]
# The last gate before anything is written, and it opens when the loop closes —
# so a person sees the plan of commits *before* the commits exist, which is the
# whole point of putting it here rather than on `shipping`.
kind     = "review-artifact"
artifact = "commit_plan"
reason   = "review the commit plan and the delivery before anything is written"
# A commit is an external effect on the repository's history. It goes to a person
# at every setting but the most autonomous one.
autonomy_floor = 9
judge = [
  "Each commit is one coherent change, and its message says what changed and why",
  "The order is one a reader could follow, and no commit depends on a later one",
  "Nothing in the plan is outside what the task asked for",
]
judge_by_reading = [
  "Each commit is one coherent change, and its message says what changed and why",
  "The order is one a reader could follow, and no commit depends on a later one",
  "Nothing in the plan is outside what the task asked for",
]

[guard]
# A delivery touching any of these stops for a person, at every knob setting.
#
# Not because these changes are likelier to be wrong than any other — because they
# are the ones a person cannot undo by reading the next morning's report. A wrong
# function is a commit to revert; a dropped table, a leaked key and a rewritten
# deploy pipeline are not.
paths  = ["migrations/", "migrate", "secret", "credential", ".env", "deploy", ".github/workflows/", "Dockerfile"]
reason = "the delivery touches migrations, credentials or deployment"
