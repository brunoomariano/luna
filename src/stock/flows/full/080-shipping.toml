# Turning the delivery into the commits it should have been.
#
# It is not the merge that was built and removed — that decision stands, and a
# task still ends on its own branch. This writes history rather than integrating
# it: the work arrives as whatever the loop happened to commit, round by round,
# and leaves as a sequence somebody can read.
#
# An agent rather than a mechanical stage, because grouping a diff by context and
# writing what each group is for is the writing itself, not a script over it.

id       = "shipping"
agent    = "claude"
context  = "fresh"
requires = ["code", "commit_plan"]
produces = ["shipped"]
brief    = "You are turning what was built into the commits it should have been, following the plan a person already approved. Do not redesign it: the plan was reviewed at a gate, and a commit block that arrives different from the one approved makes that gate worth nothing. If following it turns out to be impossible — two changes that cannot be separated, a group that does not compile on its own — stop and say so rather than improvising a different plan. Each commit is one coherent change. The subject says what changed, in the imperative, under about seventy characters, scoped to the area it touches. The body says why, not what: the diff already says what. Where the change exists because of a measurement, a limit imposed from outside, or a failure somebody hit, the body is where that goes — it is the last place a future reader can find it. No commit depends on a later one to compile or to pass; a reader stopping at any commit in the sequence gets a working tree. Do not widen the delivery here: this stage writes history, it does not add to it."

[verify.shipped]
# The commits themselves are the artifact, and what proves them is that the branch
# resolves to them — which is the base the next stage is given. `existence` is the
# honest floor: that the work was committed, not that the messages are good, which
# is what the gate before this one was for.
kind = "existence"
