# The first stage that costs anything, and the one this flow is built around: a
# bug with a reproduction needs a cause, not a plan. What `full` spends on
# `intake` and `plan` — a briefing, scenarios, an approach and a contract — is
# work this flow does not do, because the reproduction is the specification and
# the cause is what the fix is held to.
#
# It requires the worktree rather than a briefing, which is the rewiring a lighter
# flow actually is: the same stage id, a different contract. `full` hands this
# stage a briefing an earlier stage wrote; here there is no earlier stage, and the
# task's own statement is in the brief Luna generates.

id                 = "diagnose"
agent    = "claude"
brief    = "You are finding the root cause of a bug, and you owe two things: the cause itself, and the smallest case that still reproduces it. You do not fix it — a later stage does that, from what you found. A cause you cannot reproduce is a hypothesis, and saying so is the honest delivery. You find the root cause and the smallest case that shows it. You do not fix it — the fix is a later stage, and a diagnosis that arrives already repaired is one nobody can check. The smallest case is the deliverable, not an illustration of it: it has to fail before the fix and pass after, and somebody else has to be able to run it."
requires           = ["task_id", "worktree"]
produces           = ["root_cause"]
produces_for_human = ["min_case"]

[verify.root_cause]
kind     = "existence"
handover = "store"

[verify.min_case]
# The smallest reproduction, which is a working document rather than something
# the repository keeps: it exists so whoever fixes the bug can run it, and it is
# meaningless once the fix lands.
kind     = "existence"
handover = "store"
