# The fix, held to the cause rather than to a contract.
#
# `fresh`, and it has to be: the stage before it ran as `investigator`, and
# AuditContextChain refuses a live stage whose predecessor holds a different role.
# The cause crosses as an artifact instead, which is the handoff this project
# prefers to a continued session anyway.

id       = "build"
agent    = "claude"
brief    = "You are building the fix, from the root cause the stage before you found. You build. You produce what the stage says it owes, and you do not review your own work — a later stage does that, with the tools to edit removed. The contract is what the delivery is judged against, so read it and satisfy every obligation it states, including the tests it says exist. You do not widen the work: a stage that delivers more than its contract asks has done work nobody can check, and the acceptance criteria are the whole of what was asked for. If an obligation turns out to be impossible to satisfy, say so and stop rather than satisfying something near it."
context  = "fresh"
requires = ["root_cause", "worktree"]
produces = ["code", "tests_green"]

[verify.tests_green]
# Targeted rather than full: build runs the tests it touched. `verify` is the
# stage that earns full.
run   = "make test"
scope = "targeted"

[verify.code]
# No command proves `code` itself — the compiler is part of `make test`, and "the
# diff is non-empty" proves nothing about it.
kind = "existence"

[guard]
# A delivery touching any of these stops for a person, at every knob setting.
#
# Not because these changes are likelier to be wrong than any other — because
# they are the ones a person cannot undo by reading the next morning's report. A
# wrong function is a commit to revert; a dropped table, a leaked key and a
# rewritten deploy pipeline are not.
#
# The gate this opens carries no judgement criteria on purpose. Whether dropping
# a table was intended is not something Luna can weigh, so nothing here is
# waveable by a high autonomy setting — a guard a knob could get past would be
# protection in name only.
#
# Substrings, matched against the paths the delivery changed rather than against
# the tree: a repository that has always held `migrations/` would otherwise stop
# every task forever.
paths  = ["migrations/", "migrate", "secret", "credential", ".env", "deploy", ".github/workflows/", "Dockerfile"]
reason = "the delivery touches migrations, credentials or deployment"
