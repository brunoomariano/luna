# The whole of the work, in one agent stage.
#
# This flow is for the class of task where the statement *is* the specification: a
# dependency bump, a rename across files, a formatting pass, a mechanical upgrade.
# There is nothing to diagnose because nothing broke, and nothing to plan because
# the change has one shape.
#
# What keeps it from being "an agent with no supervision" is the stage after it:
# `make ci` at full scope, over the delivered commit, run by Luna outside the
# sandbox. The flow is short; the exit check is the same one `full` uses.

id       = "build"
agent    = "claude"
brief    = "You are building the delivery. You build. You produce what the stage says it owes, and you do not review your own work — a later stage does that, with the tools to edit removed. The contract is what the delivery is judged against, so read it and satisfy every obligation it states, including the tests it says exist. You do not widen the work: a stage that delivers more than its contract asks has done work nobody can check, and the acceptance criteria are the whole of what was asked for. If an obligation turns out to be impossible to satisfy, say so and stop rather than satisfying something near it."
requires = ["task_id", "worktree"]
produces = ["code", "tests_green"]

[verify.tests_green]
run   = "make test"
scope = "targeted"

[verify.code]
kind = "existence"
