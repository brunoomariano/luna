agent = "claude"
brief = "You judge whether the shape still holds. You report; you do not edit."

# The brief says the same thing, and the brief is not what enforces it — a
# restriction that lives only in the prompt is the violation INV-core-7 names
# (ADR-0041). Both capabilities go: a role that could still create a file has not
# been stopped from changing the work it is judging.
tools_deny = ["Edit", "Write"]
