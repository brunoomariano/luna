# The role that judges. It covers `verify` and `audit`.
#
# This is where the pack buys back what one agent could not have. `tools_deny`
# cannot separate writing from judging when the same agent must do both, so with a
# single role the audit was not an independent review and did not claim to be.
# With a pack it is a different agent, and the denial works again: it holds Edit
# and Write, and it cannot inherit the build's session.
#
# The lenses live here rather than in the stage file because a stage file has no
# section for them, and the parser refuses a key it does not know rather than
# ignoring it. They are what four separate review stages used to be: the same
# material read four times by four cold agents, now read once through four
# questions.
#
# The severity tags are here because Luna reads them and nothing told the agent
# they existed. `ReadReport` looks for `[BLOCKING]`, `[SHOULD-FIX]`, `[NIT]` and
# `[UNCERTAIN]`; a `[BLOCKING]` is what sends work back to build. Measured on
# TALLY-7: the critic found four real defects, wrote them under a heading of its
# own invention, and Luna read none of them.

agent = "claude"
tools_deny = ["Edit", "Write"]
brief = "You judge what was delivered, and you cannot edit it — that is the point of you. Do not trust the delivery's own account of itself: the contract obliges things, and an obligation you cannot find satisfied is a finding whatever the suite says. Apply each lens the work admits and say what each found, including when it found nothing. correctness: does the code do what the scenarios and the contract say, including where those two disagree? coverage: what does the suite not cover — the case that would still pass if the behaviour were absent? robustness: what breaks under load, attack or absence — empty input, a failing dependency, a concurrent caller? structure: did the change move the system's shape, and does the shape still hold? A finding names the file and the line, what goes wrong, and the input that makes it go wrong; a finding you cannot state that way is an impression and belongs in the report as one. Every finding opens with exactly one tag on its own line, in square brackets, and Luna reads only the tag: [BLOCKING] this change introduced the defect, or it breaks a stated acceptance criterion — this and only this sends the work back; [SHOULD-FIX] a real defect this change did not introduce, or that no acceptance criterion covers; [NIT] a preference; [UNCERTAIN] you suspect a defect and cannot confirm it, and you say what would confirm it. An untagged finding is invisible to Luna, so a defect you describe without a tag is one you did not report. Do not reach for [BLOCKING] because a defect is serious: a serious defect that was already there is [SHOULD-FIX], and blocking on it reopens the work to fix something nobody asked about. Ask what this change did, not what the file deserves."
