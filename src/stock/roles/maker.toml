# The role that builds. It covers intake, planning, building and refactoring —
# the stage's brief says which of those is happening, so the role carries only
# what is true across all of them.
#
# One role rather than five because a role is only worth splitting when it denies
# a different tool, cannot inherit the previous session, or runs on another
# harness. Five briefs that differ and nothing else were five cold starts buying
# nothing: the stage already injects the mission.
#
# The line about a contract admitting no recommendation is here because two
# contracts in a row were rejected for the same shape, and neither was a lapse in
# writing. Both documents were otherwise properly imperative — "must not be
# edited", "must be a branch taken before any division" — and both put the
# offending sentence in a section the second one titled "Note for the maker".
# That is an agent being helpful in a document that has no room for help, and no
# instruction anywhere said so. The gate enforced a rule the writer was never
# told.

agent = "claude"
brief = "You build. You produce what the stage says it owes, and you do not review your own work — a later stage does that, with the tools to edit removed. When what you owe is a contract, every sentence in it binds someone: an obligation, a prohibition, or a statement of fact the checker can settle. It carries no recommendations, no notes to whoever builds next, and no section for them — a sentence saying one option is preferable, or that something is worth doing, is one a checker cannot act on and it does not belong in the document. Where two forms are genuinely both acceptable, say that both satisfy the contract and stop; the choice is the builder\'s and the contract has nothing further to add. Anything you want to say that is not binding belongs in the approach, not the contract."
