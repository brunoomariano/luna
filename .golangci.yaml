# Linter configuration. The default preset runs about seven linters; this file
# names what the project actually wants and why, because a linter set nobody can
# justify is a linter set people disable on the first inconvenient failure.
#
# The premise: Luna orchestrates agents that write code, so the code it is made of
# has to hold up without anyone reading every line. That means the metrics do the
# reviewing — coverage, complexity, dependency direction, error handling.

version: "2"

run:
  timeout: 3m

linters:
  enable:
    # --- correctness ---------------------------------------------------------
    - errcheck        # an unchecked error is the silent failure INV-core-8 forbids
    - govet           # the compiler's own suspicions
    - staticcheck     # the deepest analyzer of the set
    - ineffassign     # a value assigned and never read is a bug or a leftover
    - unused          # dead identifiers
    - exhaustive      # a switch missing a case of a named type — the FSM is full of them
    - nilnil          # returning (nil, nil) hides which of the two the caller should test
    - errorlint       # comparing errors with == instead of errors.Is/As

    # --- security ------------------------------------------------------------
    - gosec           # the usual suspects: weak crypto, path traversal, unsafe exec

    # --- structure -----------------------------------------------------------
    - gocyclo         # cyclomatic complexity, the metric that stands in for review
    - depguard        # encodes the architectural rule that today only lives in AGENTS.md
    - gocritic        # a broad catalogue of style and correctness patterns
    - revive          # the successor to golint, configurable

    # --- clarity -------------------------------------------------------------
    - misspell
    - unconvert       # a conversion that converts nothing
    - wastedassign
    - prealloc        # a slice grown in a loop with a known length

  settings:
    gocyclo:
      # 10 is the classic threshold. Functions here are meant to be 4-20 lines
      # (AGENTS.md), so anything past this is a function that should have been two.
      min-complexity: 10

    exhaustive:
      # The FSM models states and kinds as named string types. A switch that
      # forgets one is exactly the bug the type system was supposed to prevent.
      default-signifies-exhaustive: true

    errcheck:
      # A type assertion without the ok form panics on a mismatch, which in a
      # reducer means losing the state rather than reporting a bad one.
      check-type-assertions: true

      # check-blank stays off: `defer func() { _ = rows.Close() }()` is idiomatic
      # Go, and the blank is the assertion that dropping the error was deliberate.
      # Flagging it teaches people to write `defer rows.Close()` instead, which
      # says the same thing less clearly.
      check-blank: false

      # Printing to a writer the caller owns is the one case where checking the
      # error buys nothing: if stdout is broken, reporting that fact to stdout
      # will not work either. Everything else stays checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

    depguard:
      rules:
        # The contract says what a phase owes and how each debt is proven, and
        # nothing in it executes: running a verifier belongs to internal/verify,
        # and the verdict travels back as evidence. A parser that could run a
        # command would make a contract executable by reading it.
        contract:
          files:
            - "**/src/internal/contract/**"
          deny:
            - pkg: "os/exec"
              desc: "nothing in contract executes; running a check is internal/verify"
            - pkg: "net/http"
              desc: "a contract arrives on stdin; it is never fetched"

        # The ledger records and reads back. It writes one file and asks the
        # kernel about it — it has no business running a process or reaching the
        # network, and a record that could be fetched is not a local record.
        ledger:
          files:
            - "**/src/internal/ledger/**"
          deny:
            - pkg: "os/exec"
              desc: "the ledger records what ran; running it belongs to internal/verify"
            - pkg: "net/http"
              desc: "the record is one local file, outside every checkout"
            - pkg: "database/sql"
              desc: "the record is append-only JSONL; the SQLite store was removed"

    revive:
      rules:
        - name: exported
          disabled: false
        - name: early-return
          # AGENTS.md: early returns instead of nested ifs, max 2 levels
        - name: unreachable-code
        - name: confusing-naming

  exclusions:
    rules:
      # Test files get some slack, but not on correctness: a test that ignores an
      # error is a test that can pass for the wrong reason. Only the structural
      # linters are relaxed, and only where a fake or a table genuinely needs it.
      - path: _test\.go
        linters:
          - gocyclo
          - prealloc
          - gosec
          # depguard states which packages a layer may import. A test exercises
          # the real boundary — the ledger's concurrency test spawns processes to
          # append for real — and the rule is about production layering.
          - depguard

formatters:
  enable:
    - gofumpt
    - goimports
