# Escopo da memória durável (ai-memory) deste repositório.
#
# Por que no repo, e não em ~/repos/personal/: a resolução por repo-root sobe do
# cwd procurando o arquivo, e esse caminho quebra em três casos — clone em outro
# lugar, worktree irmão (wt-luna-*), e execução sob ai-jail, que apresenta uma
# visão do filesystem onde o diretório-pai não existe. Declarar aqui torna o
# escopo propriedade do repositório, que é o que ele de fato é.
#
# ATENÇÃO — isto sozinho pode não bastar. O servidor ai-memory roda em Docker
# (data-dir /data) e resolve o escopo pelo `cwd` que o cliente MCP encaminha,
# não lendo este arquivo. `ai-memory audit-contamination` mostra 204 sessões
# mal-bucketizadas justamente por resolução de caminho. Enquanto o escopo
# personal/luna reportar 0 sessions e 0 observations, passe workspace e project
# explícitos nas chamadas:
#
#   memory_read_page(path=..., workspace="personal", project="luna")

workspace = "personal"
project   = "luna"
