# The Luna proxy for herdr.
#
# It is a window, not a system: the pane runs `luna chat`, and everything the
# conversation does goes through Luna's own CLI (ADR-0044). Uninstalling this
# plugin costs the convenience of a pane and nothing else — `luna chat` keeps
# working in any terminal.
#
# Install it with:
#
#   herdr plugin link <path-to-this-directory>
#   herdr plugin enable luna.chat
#
# Then open it from herdr:
#
#   herdr plugin pane open luna.chat chat

id                = "luna.chat"
name              = "Luna"
version           = "0.1.0"
min_herdr_version = "0.8.0"
platforms         = ["linux", "macos"]

# A pane entrypoint rather than an action: this is a terminal a person talks to,
# which is the shape the mechanism is for. ADR-0027 rejected hosting Luna's
# daemon as a plugin for the opposite reason — invocations are per-call
# subprocesses with no restart, so a resident process would hold a slot forever.
#
# `command` is argv, which is why this exists at all: `pane.split` over the socket
# takes only `cwd`, so without a manifest the proxy would have to type `luna chat`
# into a shell that is not ready yet.
#
# It runs a launcher rather than `luna` directly. argv is resolved against herdr's
# PATH, not the shell a person configured, so a developer working from a checkout
# has no installed `luna` and gets "No viable candidates found in PATH" — which
# reads as a broken plugin rather than a missing install. The launcher prefers an
# installed luna, falls back to the checkout, and explains itself when there is
# neither.
[[panes]]
id        = "chat"
title     = "Luna"
command   = ["sh", "open-chat.sh"]
placement = "split"
