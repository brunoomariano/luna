name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run has nothing to say. Cancelling on a force-push to a PR frees
# the runner for the commit that replaced it; pushes to main are left alone,
# because there the run is the record of whether that commit was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain is mise's to decide. Without this, a `go` directive newer than
  # what mise installed makes Go silently download another toolchain — which is a
  # slow step nobody asked for and a pin that stopped meaning anything.
  GOTOOLCHAIN: local

jobs:
  # The gate. Mirrors the local `make ci-check` exactly — what passes here passes
  # there, and vice versa. If the two ever diverge, that is a bug in the pipeline,
  # not a quirk to work around.
  #
  # The reported metrics run here too. They are a separate concern and were a
  # separate job, which meant paying a whole checkout and toolchain install to run
  # two commands that finish in seconds — and to rebuild the exact objects `cover`
  # had just built. `cyclo` cannot fail (it ends in `|| true`); `mod` can, and
  # deliberately: a go.mod that is not tidy is a real defect and was previously
  # reported into a log nobody reads.
  #
  # `deadcode` runs here rather than in ci-check for a reason worth stating: a
  # function written before its caller is ordinary mid-TDD, and a gate that goes
  # red in the middle of the cycle is a gate people learn to ignore. It stays
  # visible, though — three unreachable methods lived for two weeks because
  # nothing ran it, which is the cost of "reported, never gated" when nothing
  # reports either.
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          # The toolchain is pinned in mise.toml: same linter version locally and
          # here. A linter that changes its mind between the two turns a green CI
          # red with no code change, and the fix becomes guesswork.
          install: true
          cache: true
      - uses: actions/cache@v6
        with:
          # mise's own cache covers the tools it installs and nothing else, so
          # without this every job recompiled the module graph from scratch.
          # golangci-lint keeps its own cache and it is by far the slowest step.
          #
          # The dependency half of the key is go.mod, not go.sum: Luna has no
          # dependencies, so there is no go.sum, and hashFiles returns an empty
          # string for a pattern that matches nothing. That made the key equal to
          # its own restore-key, so the cache could never be invalidated by a
          # dependency change — silently, and exactly when it would matter.
          #
          # mise.toml is hashed into the key PREFIX, not just the key: a `go:`
          # backend tool is compiled against whatever Go installed it, and
          # restore-keys matches by prefix. With the toolchain only in the key,
          # a bump missed the key and then restored the previous toolchain's
          # cache through the prefix anyway. Measured on the 1.26 → 1.27 bump,
          # where a govulncheck built by 1.26.7 could not parse 1.27's stdlib.
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-check-${{ hashFiles('go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-check-
      - run: make ci-check
      - run: make cyclo
      - run: make deadcode
      - run: make mod

  # Kept out of ci-check because it needs CGO and roughly doubles the test time.
  # It runs here, where the cost is paid once, rather than on every local run.
  #
  # Its cache key is its own: race-instrumented objects are not the ones `check`
  # built, and sharing a key would have the two jobs overwrite each other's cache
  # with objects the other cannot use.
  race:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-race-${{ hashFiles('go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-race-
      - run: make race

  # Kept out of ci-check because it reaches the network. Reachability-filtered:
  # it reports only what the code actually calls, so a finding here is a finding
  # that matters.
  vuln:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-vuln-${{ hashFiles('go.mod') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-vuln-
      - run: make vuln
