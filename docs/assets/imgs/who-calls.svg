<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Who calls Luna</title>
  <desc id="d">You ask an agent for the work. The agent writes code and commits, then asks Luna whether it is done. Luna runs the project's own command over the delivered commit and answers with an exit code: 2 while it is not proven, 0 once it is.</desc>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.6 L7.4 4 L0 7.4" fill="none" stroke="#d8d4cb" stroke-width="1"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.6 L7.4 4 L0 7.4" fill="none" stroke="#c9a227" stroke-width="1.1"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#14150f"/>

  <!-- celestial hairlines, kept to the margins so nothing crosses a word -->
  <g fill="none" stroke="#6a675d" stroke-width=".55" opacity=".45">
    <circle cx="906" cy="428" r="120"/>
    <ellipse cx="906" cy="428" rx="150" ry="52" transform="rotate(-18 906 428)"/>
    <circle cx="30" cy="248" r="104"/>
    <ellipse cx="30" cy="248" rx="132" ry="46" transform="rotate(16 30 248)"/>
    <circle cx="30" cy="248" r="66" stroke-dasharray="1 7"/>
  </g>
  <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".4" d="M60 196 A 62 62 0 1 0 60 300"/>
  <g fill="#c9a227" opacity=".75">
    <path d="M898 96 l1.6 7.4 7.4 1.6 -7.4 1.6 -1.6 7.4 -1.6 -7.4 -7.4 -1.6 7.4 -1.6z"/>
    <path d="M126 118 l1.2 5.6 5.6 1.2 -5.6 1.2 -1.2 5.6 -1.2 -5.6 -5.6 -1.2 5.6 -1.2z"/>
  </g>

  <text x="56" y="50" fill="#6f6b60" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="2">WHO CALLS IT</text>
  <path fill="none" stroke="#d8d4cb" stroke-width="1" opacity=".3" d="M56 60 H 904"/>

  <!-- the three lifelines -->
  <g>
    <text x="152" y="106" fill="#e6e2d8" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="1.1">you</text>
    <text x="152" y="124" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">the person</text>
    <path fill="none" stroke="#d8d4cb" stroke-width="1" opacity=".4" d="M162 142 V 418"/>

    <text x="404" y="106" fill="#e6e2d8" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="1.1">your agent</text>
    <text x="404" y="124" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">claude, codex — whatever you already run</text>
    <path fill="none" stroke="#d8d4cb" stroke-width="1" opacity=".4" d="M414 142 V 418"/>

    <text x="700" y="106" fill="#e6e2d8" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="1.1">luna</text>
    <text x="700" y="124" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">the verifier</text>
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M710 142 V 418"/>
  </g>

  <!-- 1 · the ask -->
  <path fill="none" stroke="#d8d4cb" stroke-width="1" marker-end="url(#a)" d="M166 176 H 406"/>
  <text x="182" y="169" fill="#b9b4a8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">“implement XPTO-45”</text>

  <!-- 2 · the agent works -->
  <text x="430" y="206" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">writes code · commits</text>

  <!-- 3 · first question -->
  <path fill="none" stroke="#d8d4cb" stroke-width="1" marker-end="url(#a)" d="M418 240 H 702"/>
  <text x="434" y="233" fill="#b9b4a8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">luna check --contract -</text>

  <!-- what luna actually does, off to the right of its own lifeline -->
  <g transform="translate(730 216)">
    <path fill="none" stroke="#6a675d" stroke-width=".55" d="M0 0 h 176 v 50 h -176 z" opacity=".7"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".6" d="M0 0 v 50"/>
    <text x="14" y="20" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">runs `make ci` over the</text>
    <text x="14" y="37" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">delivered commit</text>
  </g>

  <!-- 4 · exit 2 -->
  <path fill="none" stroke="#c9a227" stroke-width="1.1" marker-end="url(#ag)" d="M702 292 H 420"/>
  <text x="446" y="285" fill="#c9a227" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">exit 2 · ci_green not proven</text>

  <!-- 5 · keeps working -->
  <text x="430" y="322" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">not done. keeps working.</text>

  <!-- 6 · second question -->
  <path fill="none" stroke="#d8d4cb" stroke-width="1" marker-end="url(#a)" d="M418 356 H 702"/>
  <text x="434" y="349" fill="#b9b4a8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">luna check --contract -</text>

  <!-- 7 · exit 0 -->
  <path fill="none" stroke="#c9a227" stroke-width="1.1" marker-end="url(#ag)" d="M702 392 H 420"/>
  <text x="516" y="385" fill="#c9a227" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">exit 0 · proven</text>

  <!-- 8 · back to you -->
  <path fill="none" stroke="#d8d4cb" stroke-width="1" marker-end="url(#a)" d="M406 424 H 168"/>
  <text x="184" y="417" fill="#b9b4a8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">done, and here is what proved it</text>

  <!-- the point -->
  <path fill="none" stroke="#d8d4cb" stroke-width="1" opacity=".3" d="M56 444 H 904"/>
  <text x="56" y="462" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">The exit code is not a sentence the agent can skip — and what it ran is in the record either way.</text>
</svg>
