<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">Inside Luna</title>
  <desc id="d">A contract arrives on stdin and is parsed and linted, with nothing executed. Verify cuts a throwaway checkout at the delivered commit and runs the project's own command there, producing one piece of evidence per artifact, each carrying the scope it proves. The ledger appends one JSON line per verdict to a file outside every checkout, refusing to write when that file is not on durable storage. The whole thing answers with an exit code: 0 proven, 2 not proven, 1 Luna could not run.</desc>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0.6 L7.4 4 L0 7.4" fill="none" stroke="#d8d4cb" stroke-width="1"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0.6 L7.4 4 L0 7.4" fill="none" stroke="#c9a227" stroke-width="1.1"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#14150f"/>

  <!-- celestial hairlines in the margins -->
  <g fill="none" stroke="#6a675d" stroke-width=".55" opacity=".4">
    <circle cx="936" cy="92" r="104"/>
    <ellipse cx="936" cy="92" rx="132" ry="44" transform="rotate(-16 936 92)"/>
    <circle cx="20" cy="470" r="98"/>
    <ellipse cx="20" cy="470" rx="126" ry="44" transform="rotate(14 20 470)"/>
    <circle cx="936" cy="92" r="58" stroke-dasharray="1 7"/>
  </g>
  <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".38" d="M900 46 A 54 54 0 1 0 900 138"/>
  <g fill="#c9a227" opacity=".7">
    <path d="M104 96 l1.5 7 7 1.5 -7 1.5 -1.5 7 -1.5 -7 -7 -1.5 7 -1.5z"/>
    <path d="M842 556 l1.2 5.4 5.4 1.2 -5.4 1.2 -1.2 5.4 -1.2 -5.4 -5.4 -1.2 5.4 -1.2z"/>
  </g>

  <text x="56" y="48" fill="#6f6b60" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="2">INSIDE</text>
  <path fill="none" stroke="#d8d4cb" stroke-width="1" opacity=".3" d="M56 58 H 904"/>

  <!-- the contract, arriving -->
  <g transform="translate(300 78)">
    <text x="0" y="0" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">the contract — written by whoever conducts, piped in on stdin</text>
    <g fill="#7d7a6f" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" transform="translate(0 20)">
      <text x="0" y="0">phase    = "forge"</text>
      <text x="0" y="15">produces = ["code", "ci_green"]</text>
      <text x="0" y="30">[verify.ci_green]  run = "make ci"  scope = "full"</text>
    </g>
  </g>
  <path fill="none" stroke="#d8d4cb" stroke-width="1" marker-end="url(#a)" d="M330 138 V 168" opacity=".8"/>

  <!-- 1 · contract -->
  <g transform="translate(96 168)">
    <path fill="none" stroke="#7d7a6f" stroke-width=".8" d="M0 0 h 768 v 78 h -768 z"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".55" d="M0 0 v 78"/>
    <text x="24" y="30" fill="#e6e2d8" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="1.7">contract</text>
    <text x="24" y="50" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">parse · lint</text>
    <text x="230" y="30" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">Refuses what cannot be read, and names every fault at once:</text>
    <text x="230" y="50" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">an artifact with no verifier, a loop converging on nothing it produces,</text>
    <text x="230" y="67" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">a check left behind by a rename.</text>
    <text x="646" y="67" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic">nothing executes here</text>
  </g>

  <path fill="none" stroke="#d8d4cb" stroke-width="1" marker-end="url(#a)" d="M480 246 V 282"/>

  <!-- 2 · verify -->
  <g transform="translate(96 282)">
    <path fill="none" stroke="#7d7a6f" stroke-width=".8" d="M0 0 h 768 v 150 h -768 z"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".55" d="M0 0 v 150"/>
    <text x="24" y="30" fill="#e6e2d8" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="1.7">verify</text>
    <text x="24" y="50" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">the only place</text>
    <text x="24" y="66" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">a command runs</text>

    <!-- the throwaway checkout -->
    <g transform="translate(230 20)">
      <path fill="none" stroke="#6a675d" stroke-width=".55" d="M0 0 h 380 v 84 h -380 z" opacity=".7"/>
      <text x="18" y="24" fill="#b9b4a8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">git worktree add --detach &lt;delivered sha&gt;</text>
      <text x="34" y="46" fill="#b9b4a8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">└─ sh -c "make ci"  →  exit code</text>
      <text x="18" y="70" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">the delivered commit, never the working tree</text>
    </g>

    <text x="230" y="128" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">One piece of evidence per artifact, each carrying the scope it proves.</text>
    <text x="646" y="128" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-style="italic">scope never upgrades</text>
  </g>

  <path fill="none" stroke="#d8d4cb" stroke-width="1" marker-end="url(#a)" d="M480 432 V 468"/>

  <!-- 3 · ledger -->
  <g transform="translate(96 468)">
    <path fill="none" stroke="#7d7a6f" stroke-width=".8" d="M0 0 h 768 v 92 h -768 z"/>
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".55" d="M0 0 v 92"/>
    <text x="24" y="30" fill="#e6e2d8" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="1.7">ledger</text>
    <text x="24" y="50" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" font-style="italic">one line, appended</text>

    <text x="230" y="26" fill="#b9b4a8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">~/.local/share/luna/ledger.jsonl</text>
    <text x="230" y="48" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">outside every checkout · statfs first, and tmpfs is refused out loud</text>
    <text x="230" y="66" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">O_APPEND, so a fleet writes with no lock · never rewritten</text>
    <text x="230" y="84" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">where a run stands is its most recent line — a tail, not a replay</text>
  </g>

  <path fill="none" stroke="#c9a227" stroke-width="1.1" marker-end="url(#ag)" d="M480 560 V 588"/>
  <text x="336" y="604" fill="#c9a227" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">exit 0 proven · 2 not proven · 1 could not run</text>
</svg>
