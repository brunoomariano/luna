<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 722" width="960" height="722" role="img" aria-labelledby="t d">
  <title id="t">The nine verbs</title>
  <desc id="d">Seven verbs a phase calls, then two it does not. luna contract lint reads a contract and reports every way it is unusable, before anything runs. luna check runs every declared check over the delivered commit and records each verdict, answering with exit 0 proven, 2 not proven, or 1 could not run; its flags are commit, base, round, dry-run and no-record. Without --commit the HEAD it takes is the worktree's, not the main repository's. luna record records what Luna did not verify: a phase, a gate, a block, an unblock, an autonomy change, or a discovery about the project. luna state reports where a run stands, which is its most recent line. luna trail prints the whole story of one run in order: every phase, check, discovery and block. luna runs lists every run, blocked first, and narrows to one repository with --here or --project, or to unfinished work with --open. Below a rule, two verbs no phase calls: luna session starts an agent with the repository's open runs as its first message, then replaces itself with the launcher; luna install-skills writes the skill Luna carries into a harness's own directory; and luna version says which build is answering.</desc>

  <defs>
  </defs>

  <rect width="960" height="722" fill="#14150f"/>

  <!-- celestial hairlines, margins only -->
  <g fill="none" stroke="#6a675d" stroke-width=".55" opacity=".38">
    <circle cx="968" cy="628" r="104"/>
    <ellipse cx="968" cy="628" rx="132" ry="44" transform="rotate(-14 968 628)"/>
    <circle cx="16" cy="112" r="86"/>
    <ellipse cx="16" cy="112" rx="112" ry="38" transform="rotate(16 16 112)"/>
  </g>
  <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".35" d="M56 66 A 50 50 0 1 0 56 152"/>
  <g fill="#c9a227" opacity=".7">
    <path d="M902 92 l1.4 6.6 6.6 1.4 -6.6 1.4 -1.4 6.6 -1.4 -6.6 -6.6 -1.4 6.6 -1.4z"/>
  </g>

  <text x="56" y="48" fill="#6f6b60" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="2">THE NINE VERBS</text>
  <path fill="none" stroke="#d8d4cb" stroke-width="1" opacity=".3" d="M56 58 H 904"/>

  <!-- 1 · contract lint -->
  <g transform="translate(56 86)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M0 -4 v 44"/>
    <text x="18" y="14" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna contract lint</text>
    <text x="18" y="34" fill="#8a8578" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">&lt;file&gt; or -</text>
    <text x="330" y="14" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">Every way the contract is unusable, reported at once.</text>
    <text x="330" y="34" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">Before anything runs — the mistake costs nothing here.</text>
  </g>
  <path fill="none" stroke="#6a675d" stroke-width=".55" d="M56 142 H 904"/>

  <!-- 2 · check -->
  <g transform="translate(56 164)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".7" d="M0 -4 v 158"/>
    <text x="18" y="14" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna check</text>
    <text x="18" y="34" fill="#8a8578" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">--contract -</text>

    <text x="330" y="14" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">Run every declared check over the delivered commit,</text>
    <text x="330" y="32" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">and record each verdict.</text>

    <g fill="#8a8578" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" transform="translate(330 58)">
      <text x="0" y="0">--commit</text>   <text x="96" y="0" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">what to verify · defaults to this worktree's HEAD</text>
      <text x="0" y="18">--base</text>     <text x="96" y="18" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">what the phase started from; a delivery equal to it is none</text>
      <text x="0" y="36">--round</text>    <text x="96" y="36" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">which round of a loop this is</text>
      <text x="0" y="54">--dry-run</text>  <text x="96" y="54" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">say what would run, run nothing</text>
      <text x="0" y="72">--no-record</text><text x="96" y="72" fill="#9b968a" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">run it all, write no ledger line</text>
    </g>

    <text x="330" y="168" fill="#c9a227" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">→  0 proven   ·   2 not proven   ·   1 could not run</text>
  </g>
  <path fill="none" stroke="#6a675d" stroke-width=".55" d="M56 352 H 904"/>

  <!-- 3 · record -->
  <g transform="translate(56 374)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M0 -4 v 44"/>
    <text x="18" y="14" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna record</text>
    <text x="18" y="34" fill="#8a8578" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">--event &lt;kind&gt;</text>
    <text x="330" y="14" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">What Luna did not verify.</text>
    <text x="330" y="34" fill="#8a8578" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">phase · gate · block · unblock · autonomy · discovery</text>
  </g>
  <path fill="none" stroke="#6a675d" stroke-width=".55" d="M56 430 H 904"/>

  <!-- 4 · state -->
  <g transform="translate(56 450)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M0 -4 v 22"/>
    <text x="18" y="12" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna state</text>
    <text x="330" y="12" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">Where a run stands: its most recent line.</text>
  </g>

  <!-- 5 · trail -->
  <g transform="translate(56 482)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M0 -4 v 22"/>
    <text x="18" y="12" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna trail</text>
    <text x="330" y="12" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">The whole story of one run: phases, checks, discoveries, blocks.</text>
  </g>

  <!-- 6 · runs -->
  <g transform="translate(56 514)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M0 -4 v 22"/>
    <text x="18" y="12" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna runs</text>
    <text x="330" y="12" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">Every run, blocked first. Narrows with --here.</text>
  </g>

  <!-- the rule: above it, what a phase calls; below it, what nobody calls twice -->
  <path fill="none" stroke="#6a675d" stroke-width="0.55" d="M56 548 H904"/>
  <text x="56" y="570" fill="#6f6b60" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" letter-spacing="2">NO PHASE CALLS THESE</text>

  <!-- 7 · session -->
  <g transform="translate(56 594)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M0 -4 v 22"/>
    <text x="18" y="12" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna session</text>
    <text x="18" y="30" fill="#8a8578" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5">&lt;agent&gt;</text>
    <text x="330" y="12" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">Starts an agent with what this repo has open as its first message.</text>
    <text x="330" y="30" fill="#8a8578" font-family="Georgia, 'Times New Roman', serif" font-size="11.5">Then it execs the launcher and stops existing.</text>
  </g>

  <!-- 8 · install-skills -->
  <g transform="translate(56 648)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M0 -4 v 22"/>
    <text x="18" y="12" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna install-skills</text>
    <text x="330" y="12" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">Writes the skill Luna carries where an agent looks.</text>
  </g>

  <!-- 9 · version -->
  <g transform="translate(56 680)">
    <path fill="none" stroke="#c9a227" stroke-width="1.1" opacity=".45" d="M0 -4 v 22"/>
    <text x="18" y="12" fill="#e6e2d8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">luna version</text>
    <text x="330" y="12" fill="#b9b4a8" font-family="Georgia, 'Times New Roman', serif" font-size="12.5">Which build is answering, and the commit it was cut from.</text>
  </g>
</svg>
