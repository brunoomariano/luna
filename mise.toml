# Project toolchain. `mise install` resolves everything.
# The Makefile (bootstrap/doctor) assumes these tools come from here.

[tools]
go = "1.27"

# Quality gates. Pinned rather than "latest": a linter that changes its mind
# between two runs turns a green CI red without a single line of code changing,
# and the fix becomes guesswork about which tool moved.
golangci-lint = "2.13.1"   # linter aggregator — see .golangci.yaml
gofumpt = "0.11.0"         # stricter than gofmt
# Pinned for the same reason as the tools above, plus one CI-specific one:
# `latest` is not a version, it is a question asked over the network. mise
# resolves it against proxy.golang.org on every install, under a 20s timeout,
# and a single timed-out lookup fails the whole `mise install` — including for a
# job that never runs the tool it was asking about. That is what broke the
# `vuln` job on 26006d1: goimports's version lookup timed out while govulncheck,
# the only tool that job needs, had already installed cleanly.
"go:golang.org/x/tools/cmd/goimports" = "0.49.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"
"go:github.com/fzipp/gocyclo/cmd/gocyclo" = "0.6.0"
